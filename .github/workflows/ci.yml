name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install hive-contracts
        run: npm ci
        working-directory: ../hive-contracts

      - name: Build hive-contracts
        run: npm run build
        working-directory: ../hive-contracts

      - name: Install Sting
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm audit --audit-level=high
