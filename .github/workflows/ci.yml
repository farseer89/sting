name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sting
        uses: actions/checkout@v4

      - name: Checkout hive-contracts
        uses: actions/checkout@v4
        with:
          repository: farseer89/hive-contracts
          path: ../hive-contracts
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ../hive-contracts/package-lock.json

      - name: Install hive-contracts
        working-directory: ../hive-contracts
        run: npm ci

      - name: Build hive-contracts
        working-directory: ../hive-contracts
        run: npm run build

      - name: Install Sting
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm audit --audit-level=high
