name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GITHUB_TOKEN can read farseer89/hive-contracts when that repo allows workflow access
# from other repos (Settings → Actions → General → Workflow access).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sting
        uses: actions/checkout@v4

      - name: Checkout hive-contracts
        uses: actions/checkout@v4
        with:
          repository: farseer89/hive-contracts
          path: vendor/hive-contracts
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Link hive-contracts for file:../hive-contracts
        run: |
          rm -rf ../hive-contracts
          mkdir -p ../hive-contracts
          cp -a vendor/hive-contracts/. ../hive-contracts/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ../hive-contracts/package-lock.json

      - name: Install hive-contracts
        working-directory: ../hive-contracts
        run: npm ci

      - name: Build hive-contracts
        working-directory: ../hive-contracts
        run: npm run build

      - name: Install Sting
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm audit --audit-level=high
