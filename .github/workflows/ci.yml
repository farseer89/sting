name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Require GH_PAT for private hive-contracts
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::CI needs repository secret GH_PAT (classic PAT with repo scope) to clone private farseer89/hive-contracts."
            echo "Create one at https://github.com/settings/tokens then: gh secret set GH_PAT -R farseer89/sting"
            exit 1
          fi

      - name: Checkout Sting
        uses: actions/checkout@v4

      - name: Checkout hive-contracts (private)
        uses: actions/checkout@v4
        with:
          repository: farseer89/hive-contracts
          path: vendor/hive-contracts
          token: ${{ secrets.GH_PAT }}

      - name: Link hive-contracts for file:../hive-contracts
        run: |
          rm -rf ../hive-contracts
          mkdir -p ../hive-contracts
          cp -a vendor/hive-contracts/. ../hive-contracts/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install hive-contracts
        working-directory: ../hive-contracts
        run: npm ci

      - name: Build hive-contracts
        working-directory: ../hive-contracts
        run: npm run build

      - name: Install Sting
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm audit --audit-level=high
