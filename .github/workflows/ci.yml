name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sting
        uses: actions/checkout@v4

      - name: Checkout hive-contracts (sibling for file:../hive-contracts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/farseer89/hive-contracts.git" \
            ../hive-contracts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ../hive-contracts/package-lock.json

      - name: Install hive-contracts
        working-directory: ../hive-contracts
        run: npm ci

      - name: Build hive-contracts
        working-directory: ../hive-contracts
        run: npm run build

      - name: Install Sting
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm audit --audit-level=high
