<p-toast />
<div class="surface-card p-4 border-round shadow-2">
  <h2 class="m-0">PrimeNG playground</h2>
  <p class="mt-2 mb-4 text-600">Copy imports and snippets into new features. See docs/primeng/ for full API.</p>

  <section class="mb-4">
    <h3 class="mt-0">Live</h3>
    <div class="flex flex-wrap align-items-center gap-3 mb-3">
      <input pInputText [(ngModel)]="demoInput" placeholder="Demo input" />
      <p-button label="Toast" icon="pi pi-bell" (onClick)="showToast()" />
      <p-tag [value]="demoInput || 'Tag'" severity="success" />
    </div>
  </section>

  @for (ex of examples; track ex.title) {
    <section class="mb-4">
      <h3 class="mt-0">{{ ex.title }}</h3>
      <pre class="snippet surface-ground p-3 border-round text-sm">{{ ex.snippet }}</pre>
    </section>
  }
</div>
