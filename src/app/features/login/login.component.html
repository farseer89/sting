<p-toast />
<div class="login-page surface-ground min-h-screen flex align-items-center justify-content-center p-4">
  <div class="surface-card p-5 shadow-2 border-round w-full login-card">
    <h1 class="text-2xl font-bold text-center m-0 mb-1">{{ appName }}</h1>
    <p class="text-center text-color-secondary mt-0 mb-4">Sign in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field mb-3">
        <label for="email" class="block font-medium mb-2">Email</label>
        <input id="email" type="email" pInputText formControlName="email" class="w-full" autocomplete="email" />
      </div>

      <div class="field mb-3">
        <label for="password" class="block font-medium mb-2">Password</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </div>

      <div class="flex align-items-center gap-2 mb-4">
        <p-checkbox formControlName="rememberMe" [binary]="true" inputId="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>

      <p-button type="submit" label="Sign in" styleClass="w-full" [loading]="isLoggingIn" />
    </form>
  </div>
</div>
