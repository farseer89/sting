<div class="bk-pattern-panel">
  <div class="bk-pattern-panel__filter" role="tablist" aria-label="Pattern catalog filter">
    <button type="button" [class.is-active]="catalogFilter() === 'compatible'" (click)="setFilter('compatible')">
      This template
    </button>
    <button type="button" [class.is-active]="catalogFilter() === 'all'" (click)="setFilter('all')">
      All patterns
    </button>
  </div>

  <div class="bk-pattern-panel__scroll">
    @for (group of patternGroups(); track group.patternId) {
      <button
        type="button"
        class="bk-pattern-panel__row"
        [class.is-selected]="selectedPatternId() === group.patternId"
        (click)="onPatternClick(group.patternId)"
      >
        @if (defaultVariantBlockId(group); as thumbId) {
          <app-protopipe-build-block-nav-thumb [blockId]="thumbId" density="catalog" />
        }
        <span class="bk-pattern-panel__meta">
          <strong>{{ group.patternLabel }}</strong>
          @if (patternIntentLabels(group.patternId); as intents) {
            @if (intents.length > 0) {
              <span class="bk-intent-chips">
                @for (intent of intents; track intent) {
                  <span class="bk-intent-chip">{{ intent }}</span>
                }
              </span>
            }
          }
          <span class="bk-pattern-panel__count">
            {{ group.variants.length }} variant{{ group.variants.length === 1 ? '' : 's' }}
          </span>
        </span>
      </button>
    }
  </div>
</div>
