<div class="kwavatar">
  <p class="kwavatar__lede">
    Each profile represents a type of person searching for your services. Choose up to
    {{ maxSelected() }} — your content plan will be written for them.
  </p>
  <div class="kwavatar__grid" role="list">
    @for (av of avatars(); track av.id) {
      <button
        type="button"
        class="kwavatar__card"
        role="listitem"
        [class.kwavatar__card--selected]="isSelected(av.id)"
        [class.kwavatar__card--disabled]="!canSelect(av.id)"
        [class.kwavatar__card--hovered]="hoveredId() === av.id"
        [style]="avatarStyle(av.id)"
        [attr.aria-pressed]="isSelected(av.id)"
        (click)="onCardClick(av.id)"
        (mouseenter)="onCardEnter(av.id)"
        (mouseleave)="onCardLeave()"
      >
        <div class="kwavatar__profile">
          <span class="kwavatar__portrait" aria-hidden="true">{{ initials(av) }}</span>
          <div class="kwavatar__identity">
            <span class="kwavatar__role">{{ profileTitle(av) }}</span>
            <span class="kwavatar__subtitle">{{ profileSubtitle(av) }}</span>
          </div>
          <span class="kwavatar__select" [class.kwavatar__select--on]="isSelected(av.id)" aria-hidden="true">
            @if (isSelected(av.id)) {
              <svg viewBox="0 0 12 12" width="10" height="10"><path d="M2 6l3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
            }
          </span>
        </div>

        <p class="kwavatar__bio">{{ av.description }}</p>

        @if (av.exampleQueries.length) {
          <div class="kwavatar__searches" aria-label="Example searches">
            <span class="kwavatar__searches-label">They search for</span>
            <div class="kwavatar__chips">
              @for (q of av.exampleQueries.slice(0, 3); track q) {
                <span class="kwavatar__chip">{{ q }}</span>
              }
            </div>
          </div>
        }

        <footer class="kwavatar__foot">
          @if (av.clusterVolume != null) {
            <span class="kwavatar__stat">
              <span class="kwavatar__stat-val">{{ formatVolume(av.clusterVolume) }}</span>
              <span class="kwavatar__stat-lbl">cluster volume</span>
            </span>
          }
          @if (av.matchedOnboarding) {
            <span class="kwavatar__badge">Onboarding match</span>
          }
          @if (isSelected(av.id)) {
            <span class="kwavatar__badge kwavatar__badge--selected">Selected</span>
          }
        </footer>
      </button>
    }
  </div>
</div>
