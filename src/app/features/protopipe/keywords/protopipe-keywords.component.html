<p-toast />
<p-confirmDialog />
<div class="protopipe-keywords">
  <div class="protopipe-keywords__panel surface-card border-round shadow-2">
    <header class="protopipe-keywords__header">
      <div class="protopipe-keywords__title-block">
        <h1 class="protopipe-keywords__title m-0">Targeted keywords</h1>
        <span class="protopipe-keywords__meta text-color-secondary">
          {{ keywords().length }} on My Plan
          @if (dirty()) {
            · <span class="text-orange-500">unsaved changes</span>
          }
        </span>
      </div>
      <div class="protopipe-keywords__actions flex align-items-center gap-2">
        <p-button
          label="Save"
          icon="pi pi-save"
          size="small"
          [disabled]="!dirty() || saving() || loading()"
          [loading]="saving()"
          (onClick)="saveKeywords()"
        />
        <a routerLink="/protopipe">
          <p-button label="My Plan" icon="pi pi-compass" size="small" [outlined]="true" />
        </a>
      </div>
    </header>

    @if (error()) {
      <p class="protopipe-keywords__error m-0 mb-3 text-red-500" role="alert">{{ error() }}</p>
    }

    <div class="protopipe-keywords__add" role="form" aria-label="Add keyword">
      <input
        pInputText
        pSize="small"
        class="protopipe-keywords__add-phrase"
        placeholder="New keyword phrase"
        [attr.maxlength]="maxPhraseLength"
        [ngModel]="newPhrase()"
        (ngModelChange)="newPhrase.set($event)"
        (keyup.enter)="addKeyword()"
      />
      <p-select
        pSize="small"
        [options]="intentOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="newIntent()"
        (ngModelChange)="newIntent.set($event)"
      />
      <p-select
        pSize="small"
        [options]="priorityOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="newPriority()"
        (ngModelChange)="newPriority.set($event)"
      />
      <input
        pInputText
        pSize="small"
        class="protopipe-keywords__add-notes"
        placeholder="Notes (optional)"
        [attr.maxlength]="maxNotesLength"
        [ngModel]="newNotes()"
        (ngModelChange)="newNotes.set($event)"
        (keyup.enter)="addKeyword()"
      />
      <p-button
        icon="pi pi-plus"
        size="small"
        pTooltip="Add keyword"
        tooltipPosition="top"
        (onClick)="addKeyword()"
        ariaLabel="Add keyword"
      />
    </div>

    @if (keywords().length === 0) {
      <p class="protopipe-keywords__empty m-0 text-color-secondary">No keywords yet — add one above.</p>
    } @else {
      <div class="protopipe-keywords__table-wrap">
        <p-table
          [value]="keywords()"
          [rowHover]="true"
          styleClass="protopipe-kw-table p-datatable-sm"
          responsiveLayout="scroll"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>Keyword</th>
              <th class="col-narrow">Intent</th>
              <th class="col-narrow">Priority</th>
              <th>Notes</th>
              <th class="col-action"></th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-kw>
            <tr>
              <td>
                <input
                  pInputText
                  pSize="small"
                  class="w-full"
                  [attr.maxlength]="maxPhraseLength"
                  [ngModel]="kw.phrase"
                  (ngModelChange)="onPhraseChange(kw, $event)"
                />
              </td>
              <td>
                <p-select
                  pSize="small"
                  [options]="intentOptions"
                  optionLabel="label"
                  optionValue="value"
                  [ngModel]="kw.intent"
                  (ngModelChange)="onIntentChange(kw, $event)"
                  styleClass="w-full"
                />
              </td>
              <td>
                <p-select
                  pSize="small"
                  [options]="priorityOptions"
                  optionLabel="label"
                  optionValue="value"
                  [ngModel]="kw.priority"
                  (ngModelChange)="onPriorityChange(kw, $event)"
                  styleClass="w-full"
                />
              </td>
              <td>
                <input
                  pInputText
                  pSize="small"
                  class="w-full"
                  placeholder="—"
                  [attr.maxlength]="maxNotesLength"
                  [ngModel]="kw.notes ?? ''"
                  (ngModelChange)="onNotesChange(kw, $event)"
                />
              </td>
              <td>
                <p-button
                  type="button"
                  icon="pi pi-trash"
                  severity="danger"
                  size="small"
                  [text]="true"
                  (onClick)="confirmRemove(kw, $event)"
                  ariaLabel="Remove keyword"
                />
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    }
  </div>
</div>
