<div class="studio">
  <header class="studio__bar">
    <div class="studio__title">
      <span class="studio__crumb">Lab</span>
      <span class="studio__sep">/</span>
      <span class="studio__name">Article pipeline</span>
    </div>

    <span
      class="studio__status"
      [class.is-running]="status() === 'running'"
      [class.is-complete]="status() === 'complete'"
      [class.is-failed]="status() === 'failed'"
    >
      {{ statusLabel() }}
    </span>

    @if (articleType) {
      <span class="studio__type-pill" [attr.title]="'Inferred article type'">
        {{ articleType }}
      </span>
    }

    <div class="studio__actions">
      <div class="studio__keyword">
        <p-select
          [options]="keywordOptions()"
          [ngModel]="selectedKeywordId()"
          (ngModelChange)="selectedKeywordId.set($event)"
          optionLabel="label"
          optionValue="value"
          placeholder="Pick a keyword"
          [filter]="true"
          appendTo="body"
        />
      </div>
      <p-button
        label="Run"
        icon="pi pi-play"
        size="small"
        [loading]="starting()"
        [disabled]="!canRun()"
        (onClick)="run_pipeline()"
      />
      @if (canSavePost()) {
        <p-button
          label="Save as scheduled post"
          icon="pi pi-calendar-plus"
          severity="success"
          size="small"
          [loading]="saving()"
          (onClick)="saveAsPost()"
        />
      }
      <button
        type="button"
        class="studio__inspector-toggle"
        [class.is-active]="inspectorOpen()"
        [attr.aria-pressed]="inspectorOpen()"
        [attr.aria-label]="inspectorOpen() ? 'Hide inspector' : 'Show inspector'"
        (click)="toggleInspector()"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.5 3.5h11v9h-11z" />
          <path d="M10 3.5v9" />
        </svg>
        <span>Inspector</span>
      </button>
    </div>
  </header>

  <div
    #body
    class="studio__body"
    [class.has-inspector]="inspectorOpen()"
    [style.--inspector-width.%]="inspectorWidthPct()"
  >
    <app-article-pipeline-outline
      [run]="run()"
      [activeStep]="activeStep()"
      (stepSelected)="selectStep($event)"
    />

    <main class="studio__stage">
      <app-article-pipeline-step-panel
        [run]="run()"
        [activeStep]="activeStep()"
      />
    </main>

    @if (inspectorOpen()) {
      <div
        class="studio__splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize inspector"
        (pointerdown)="onSplitterPointerDown($event)"
      ></div>

      <aside class="studio__inspector" aria-label="Inspector">
        <div class="studio__inspector-body">
          @if (inspectorMode() === 'chat') {
            <app-article-pipeline-chat [activeStep]="activeStep()" />
          } @else {
            <app-article-pipeline-behind
              [run]="run()"
              [activeStep]="activeStep()"
              (rerun)="rerunActiveStep($event)"
            />
          }
        </div>

        <nav class="studio__inspector-rail" aria-label="Inspector mode">
          <button
            type="button"
            class="studio__inspector-rail-btn"
            [class.is-active]="inspectorMode() === 'chat'"
            [attr.aria-pressed]="inspectorMode() === 'chat'"
            aria-label="Chat"
            title="Chat"
            (click)="setInspectorMode('chat')"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" />
            </svg>
          </button>
          <button
            type="button"
            class="studio__inspector-rail-btn"
            [class.is-active]="inspectorMode() === 'behind'"
            [attr.aria-pressed]="inspectorMode() === 'behind'"
            aria-label="Behind the scenes"
            title="Behind the scenes"
            (click)="setInspectorMode('behind')"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5.5 4l-3 4 3 4M10.5 4l3 4-3 4" />
            </svg>
          </button>
        </nav>
      </aside>
    }
  </div>

  <p-toast position="bottom-right" />
</div>
