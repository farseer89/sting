<section
  class="journey"
  [style.--journey-accent]="accentColor()"
  aria-label="How {{ packLabel() }} runs through its cognitive process"
>
  <div class="journey__header">
    <div>
      <h2 class="journey__title">Process flow</h2>
      <p class="journey__subtitle">Each cognitive step runs in sequence before writing starts.</p>
    </div>
    <button
      type="button"
      class="journey__play"
      [attr.aria-pressed]="isPlaying()"
      (click)="togglePlayback()"
    >
      {{ isPlaying() ? 'Pause' : 'Play' }}
    </button>
  </div>

  <div class="journey__flow" [style.--step-count]="stepCount()">
    <div class="journey__progress" aria-hidden="true">
      <span class="journey__progress-track"></span>
      <span class="journey__progress-fill" [style.width.%]="progressPercent()"></span>
    </div>

    <ol class="journey__stations">
      @for (step of steps(); track step.id; let i = $index) {
        <li
          class="journey__station"
          [class.is-active]="activeStep() === i"
          [class.is-passed]="activeStep() > i"
          [class.journey__station--start]="step.kind === 'start'"
          [class.journey__station--finish]="step.kind === 'finish'"
        >
          <button
            type="button"
            class="journey__station-btn"
            [attr.aria-current]="activeStep() === i ? 'step' : null"
            (click)="goToStep(i)"
          >
            <span class="journey__station-marker" aria-hidden="true">
              @if (activeStep() > i) {
                <svg viewBox="0 0 12 12" class="journey__check" aria-hidden="true">
                  <path d="M2.5 6.2 5 8.7 9.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              } @else {
                <span class="journey__station-index">{{ i + 1 }}</span>
              }
            </span>
            <span class="journey__station-label">{{ step.label }}</span>
          </button>
        </li>
      }
    </ol>
  </div>

  @if (activeDetail(); as step) {
    <div class="journey__caption" role="status" aria-live="polite">
      <span class="journey__caption-step">
        Step {{ activeStep() + 1 }} of {{ stepCount() }}
      </span>
      <strong class="journey__caption-label">{{ step.label }}</strong>
      <p class="journey__caption-detail">{{ step.detail }}</p>
    </div>
  }
</section>
